<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>어두운 학교 탈출 - 진행 버그 수정 버전</title>
    <style>
        body {
            margin: 0; padding: 0; background-color: #010102;
            color: #eee; font-family: 'Malgun Gothic', sans-serif; overflow: hidden; user-select: none;
        }

        /* 복도 너비 1100px */
        #game-container {
            position: relative; width: 1100px; height: 550px; margin: 20px auto;
            background: #000000;
            border: 4px solid #1a1a1a; border-radius: 6px; overflow: hidden;
            box-shadow: 0 0 50px rgba(0,0,0,1);
        }

        /* 손전등(라이트) 레이어 */
        #flashlight-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 25;
            background: rgba(0, 0, 0, 0.99);
        }

        /* 탈출 문 위치 (오른쪽 끝 1000px 지점) */
        .door {
            position: absolute; left: 980px; top: 300px; width: 75px; height: 150px;
            background: linear-gradient(90deg, #2c1a10, #3d2516, #1f120a);
            border: 3px solid #0f0905; border-radius: 2px;
            box-shadow: inset -5px 0 10px #000;
        }
        .door-label {
            position: absolute; top: -45px; left: -25px; width: 120px; text-align: center;
            font-size: 12px; color: #ff3333; background: rgba(0, 0, 0, 0.9);
            padding: 6px; border-radius: 4px; border: 1px solid #7f1d1d;
            font-weight: bold; box-shadow: 0 4px 10px #000; display: none; z-index: 26;
        }

        /* 주인공 (학생) */
        #player {
            position: absolute; left: 150px; top: 380px; width: 45px; height: 70px;
            background: linear-gradient(135deg, #2471a3, #154360);
            border: 2px solid #3498db; border-radius: 4px;
            box-shadow: 0 0 15px rgba(0,0,0,0.8);
            display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 5px 0; box-sizing: border-box; z-index: 10;
        }
        .player-eye { width: 28px; height: 8px; background: #fff; border-radius: 2px; display: flex; justify-content: space-around; align-items: center; }
        .player-eye::before, .player-eye::after { content: ''; width: 6px; height: 6px; background: #000; border-radius: 50%; }
        .player-tag { font-size: 11px; font-weight: bold; color: #ccc; }

        /* 웅크리기 스타일 */
        #player.crouch {
            height: 38px !important;
            top: 412px !important;
            background: linear-gradient(135deg, #1a5276, #0e334c);
        }

        /* 기어 오는 괴물 */
        #chaser {
            position: absolute; left: -160px; top: 290px; width: 95px; height: 160px;
            background: black; border: 4px solid #850000; border-radius: 12px; display: none;
            flex-direction: column; align-items: center; justify-content: center;
            z-index: 9; box-shadow: 0 0 40px #ff0000, inset 0 0 30px #200000;
            animation: gore-shake 0.15s infinite;
        }
        .monster-eye { width: 70px; height: 25px; display: flex; justify-content: space-between; }
        .monster-eye::before, .monster-eye::after { 
            content: ''; width: 22px; height: 22px; background: #ff0000; border-radius: 50%; 
            box-shadow: 0 0 25px #ff0000, 0 0 5px #fff;
        }
        .monster-mouth { width: 60px; height: 35px; border-bottom: 6px dashed #ff0000; border-radius: 50%; }
        
        @keyframes gore-shake {
            0% { transform: translate(1px, 1px); }
            50% { transform: translate(-1px, -1px); }
            100% { transform: translate(1px, -1px); }
        }

        /* [학교 의자] 바닥 장애물 */
        .obstacle-chair {
            position: absolute; width: 40px; height: 50px;
            background: linear-gradient(180deg, #5c3a21 0%, #a0522d 40%, #2d1a10 100%);
            border: 2px solid #3e2716; border-radius: 3px;
            box-shadow: 0 4px 8px #000;
        }
        .obstacle-chair::before {
            content: ''; position: absolute; top: 0; left: 6px; width: 24px; height: 18px;
            border-bottom: 3px solid #2d1a10;
        }

        /* [학교 책상] 상공 장애물 */
        .obstacle-desk {
            position: absolute; width: 75px; height: 65px;
            background: linear-gradient(180deg, #1c2833 0%, #34495e 20%, #7f8c8d 25%, #2c3e50 100%);
            border-bottom: 5px solid #7f1d1d;
            box-shadow: 0 5px 15px rgba(0,0,0,0.9);
        }
        .obstacle-desk::after {
            content: '⚠️'; position: absolute; bottom: 4px; left: 0; width: 100%;
            text-align: center; font-size: 12px;
        }

        /* UI */
        #mission-box {
            position: absolute; top: 20px; right: 20px; width: 240px;
            background: rgba(0, 0, 0, 0.9); border-left: 5px solid #922b21;
            padding: 12px; display: none; z-index: 30; font-size: 13px; color: #ccc;
        }
        #dialogue-box {
            position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%);
            width: 85%; background: #050505; border: 2px solid #7f1d1d;
            padding: 18px; box-sizing: border-box; text-align: center;
            font-size: 16px; font-weight: bold; line-height: 1.6; z-index: 30;
            cursor: pointer; border-radius: 4px; box-shadow: 0 10px 30px #000;
        }
        .controls-guide { font-size: 12px; color: #666; font-weight: normal; margin-top: 5px; }

        .screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 100; display: none;
        }
        .screen h1 { font-size: 36px; margin-bottom: 25px; letter-spacing: 2px; }
        .screen button {
            padding: 12px 28px; background: #7f1d1d; border: 1px solid #ff0000; color: white;
            font-size: 15px; cursor: pointer; border-radius: 2px; font-weight: bold; box-shadow: 0 0 10px #7f1d1d;
        }
        .screen button:hover { background: #b01e1e; }
    </style>
</head>
<body>

<div id="game-container">
    <div id="flashlight-overlay"></div>

    <div id="mission-box">
        <b style="color: #ff3333; font-size: 14px;">[🚨 실시간 가이드]</b><br><br>
        • <b style="color: #f1c40f;">R 키: 손전등 On/Off</b><br>
        • 학교 의자: 위쪽 방향키(↑) 또는 스페이스 점프<br>
        • 매달린 책상: Ctrl 키로 숙이기 (토글)<br>
        • 술래 괴물의 속도가 대폭 느려졌습니다!
    </div>

    <div id="dialogue-box">
        "여긴 어디지...? 정신을 차려보니 어두운 교실 안이다. <br>일단 <b style='color:#f1c40f;'>[R 키]를 눌러 손전등을 켜고</b> 오른쪽 끝 문으로 가보자."
        <div class="controls-guide">[ 클릭하면 창이 닫히며 조작이 시작됩니다 ]</div>
    </div>

    <div id="game-over-screen" class="screen">
        <h1 style="color: #ff0000; text-shadow: 0 0 15px #ff0000;">잡혔습니다.</h1>
        <button onclick="resetGame()">다시 시도</button>
    </div>
    <div id="game-clear-screen" class="screen">
        <h1 style="color: #2ecc71; text-shadow: 0 0 15px #2ecc71;">탈출에 성공했습니다.</h1>
        <button onclick="resetGame()">다시 하기</button>
    </div>

    <div id="chaser">
        <div class="monster-eye"></div>
        <div class="monster-mouth"></div>
    </div>
    
    <div id="player">
        <div class="player-eye"></div>
        <div class="player-tag">학생</div>
    </div>
    
    <div class="door" id="escape-door">
        <div class="door-label" id="door-label">['E' 키] 문 열기</div>
    </div>

    <!-- 촘촘하고 늘어난 학교 장애물 (추격전 시작 시 활성화) -->
    <div class="obstacle-chair" id="obs1" style="left: 280px; top: 400px; display:none;"></div>
    <div class="obstacle-desk"  id="obs2" style="left: 380px; top: 300px; display:none;"></div>
    <div class="obstacle-chair" id="obs3" style="left: 490px; top: 400px; display:none;"></div>
    <div class="obstacle-desk"  id="obs4" style="left: 580px; top: 300px; display:none;"></div>
    <div class="obstacle-chair" id="obs5" style="left: 680px; top: 400px; display:none;"></div>
    <div class="obstacle-desk"  id="obs6" style="left: 770px; top: 300px; display:none;"></div>
    <div class="obstacle-chair" id="obs7" style="left: 860px; top: 400px; display:none;"></div>
    <div class="obstacle-desk"  id="obs8" style="left: 930px; top: 300px; display:none;"></div>
    <div class="obstacle-chair" id="obs9" style="left: 1010px; top: 400px; display:none;"></div>
</div>

<script>
    let gameState = "INTRO"; 
    let isJumping = false;
    let isCrouching = false; 
    let isLightOn = false; 
    
    let playerX = 150;
    let playerY = 380;
    const floorY = 380;
    let jumpVelocity = 0;
    const gravity = 0.58; 
    
    let chaserX = -180;
    let chaserSpeed = 1.6; // 느려진 술래 속도
    let playerSpeed = 4.2;

    const keys = { Left: false, Right: false };

    const player = document.getElementById('player');
    const chaser = document.getElementById('chaser');
    const dialogueBox = document.getElementById('dialogue-box');
    const missionBox = document.getElementById('mission-box');
    const doorLabel = document.getElementById('door-label');
    const lightOverlay = document.getElementById('flashlight-overlay');
    const obstacles = document.querySelectorAll('[class^="obstacle-"]');

    dialogueBox.addEventListener('click', () => {
        if (gameState === "INTRO") {
            dialogueBox.style.display = 'none';
            gameState = "CLASSROOM";
            gameLoop();
        }
    });

    window.addEventListener('keydown', (e) => {
        if (gameState === "INTRO" || gameState === "END") return;

        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = true;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = true;
        
        if (e.code === 'KeyR') {
            isLightOn = !isLightOn;
        }

        if (e.code === 'ControlLeft' || e.code === 'ControlRight') {
            e.preventDefault(); 
            if (!isJumping) {
                isCrouching = !isCrouching;
                if (isCrouching) player.classList.add('crouch');
                else player.classList.remove('crouch');
            }
        }

        if ((e.code === 'ArrowUp' || e.code === 'Space') && !isJumping && !isCrouching) {
            isJumping = true;
            jumpVelocity = -10.8;
        }

        /* [수정] 플레이어가 우측 끝 문(980px 지점)에 도달했을 때 정확히 E키 판정이 작동하도록 수정 */
        if (e.code === 'KeyE' && gameState === "CLASSROOM") {
            if (playerX >= 900 && playerX <= 1060) {
                startChaseMode();
            }
        }
        
        if (e.code === 'KeyE' && gameState === "CHASE") {
            if (playerX >= 930 && playerX <= 1060 && !isCrouching) {
                endGame(true);
            }
        }
    });

    window.addEventListener('keyup', (e) => {
        if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.Left = false;
        if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.Right = false;
    });

    function startChaseMode() {
        gameState = "CHASE";
        missionBox.style.display = 'block';
        chaser.style.display = 'flex';
        obstacles.forEach(obs => obs.style.display = 'block');
        playerX = 200; // 문을 열면 앞쪽 복도로 자동 소환되며 추격 시작
        chaserX = -120;
    }

    function gameLoop() {
        if (gameState === "INTRO" || gameState === "END") return;

        let currentSpeed = isCrouching ? playerSpeed * 0.45 : playerSpeed;
        if (keys.Left) playerX -= currentSpeed;
        if (keys.Right) playerX += currentSpeed;

        /* [버그 수정 핵심] 우측 이동 제한 장벽을 750px -> 1050px로 늘려 문 앞까지 갈 수 있게 만듦 */
        if (playerX < 0) playerX = 0;
        if (playerX > 1050) playerX = 1050; 

        if (isJumping) {
            playerY += jumpVelocity;
            jumpVelocity += gravity;
            if (playerY >= floorY) { playerY = floorY; isJumping = false; jumpVelocity = 0; }
        }

        if (gameState === "CHASE") {
            chaserX += chaserSpeed;
            if (chaserX + 95 >= playerX + 12) { endGame(false); return; }
        }

        let targetY = isCrouching && !isJumping ? 412 : playerY;
        let centerX = playerX + 22; 
        let centerY = targetY + (isCrouching ? 19 : 35); 

        // 전방 라이트 시스템
        if (isLightOn) {
            if (gameState === "CHASE") {
                lightOverlay.style.background = `linear-gradient(to right, rgba(0,0,0,0.99) ${centerX - 60}px, rgba(50, 0, 0, 0.15) ${centerX + 20}px, rgba(40, 0, 0, 0.15) 100%)`;
            } else {
                lightOverlay.style.background = `linear-gradient(to right, rgba(0,0,0,0.99) ${centerX - 50}px, rgba(0,0,0,0) ${centerX + 30}px, rgba(0,0,0,0) 100%)`;
            }
        } else {
            lightOverlay.style.background = `radial-gradient(circle 35px at ${centerX}px ${centerY}px, transparent 100%, rgba(0, 0, 0, 0.99) 100%)`;
        }

        // 장애물 충돌 (추격전 때만 작동)
        if (gameState === "CHASE") {
            obstacles.forEach(obs => {
                let obsX = parseInt(obs.style.left);
                let obsY = parseInt(obs.style.top);
                
                if (obs.classList.contains('obstacle-desk')) {
                    if (playerX + 45 > obsX && playerX < obsX + 75) {
                        if (!isCrouching) playerX = obsX - 46; 
                    }
                } else {
                    if (playerX + 45 > obsX && playerX < obsX + 40) {
                        if (isJumping && jumpVelocity > 0 && playerY + 70 >= obsY && playerY + 50 < obsY) {
                            playerY = obsY - 70; isJumping = false; jumpVelocity = 0;
                        } else if (playerY + 70 > obsY) {
                            if (keys.Right && playerX < obsX) playerX = obsX - 45;
                            if (keys.Left && playerX > obsX) playerX = obsX + 40;
                        }
                    }
                }
            });
        }

        /* [수정] 문 근처에 갔을 때의 텍스트 UI 판정 범위 확장 */
        if (gameState === "CLASSROOM" && playerX >= 900) {
            doorLabel.style.display = 'block'; doorLabel.innerText = "[E 키] 문 열기";
        } else if (gameState === "CHASE" && playerX >= 930) {
            doorLabel.style.display = 'block'; doorLabel.innerText = "[E 키] 탈출하기!";
        } else {
            doorLabel.style.display = 'none';
        }

        player.style.left = playerX + 'px';
        player.style.top = targetY + 'px';
        chaser.style.left = chaserX + 'px';

        requestAnimationFrame(gameLoop);
    }

    function endGame(isWin) {
        gameState = "END";
        if (isWin) document.getElementById('game-clear-screen').style.display = 'flex';
        else document.getElementById('game-over-screen').style.display = 'flex';
    }

    function resetGame() {
        gameState = "INTRO"; isJumping = false; isCrouching = false; isLightOn = false;
        playerX = 150; playerY = 380; chaserX = -180;
        player.className = "";
        player.style.left = playerX + 'px'; player.style.top = playerY + 'px';
        chaser.style.left = chaserX + 'px'; chaser.style.display = 'none';
        
        document.getElementById('game-over-screen').style.display = 'none';
        document.getElementById('game-clear-screen').style.display = 'none';
        doorLabel.style.display = 'none'; missionBox.style.display = 'none';
        obstacles.forEach(obs => obs.style.display = 'none');
        
        dialogueBox.innerHTML = `"여긴 어디지...? 정신을 차려보니 어두운 교실 안이다. <br>일단 <b style='color:#f1c40f;'>[R 키]를 눌러 손전등을 켜고</b> 오른쪽 끝 문으로 가보자."<div class="controls-guide">[ 클릭하면 창이 닫히며 조작이 시작됩니다 ]</div>`;
        dialogueBox.style.display = 'block';
    }
</script>
</body>
</html>
