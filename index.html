<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>RANDOM ESCAPE</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Noto Sans KR",sans-serif;background:#05080d;color:#fff}
button{border:0;border-radius:14px;padding:13px 20px;font-weight:900;cursor:pointer}
#app{position:relative;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 45%,#26384d,#0b111b 55%,#03050a)}
#start{position:absolute;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,#1d334c,#05070c 72%)}
.start{width:min(900px,94vw);text-align:center}
.start h1{margin:0;font-size:clamp(44px,9vw,88px);letter-spacing:5px}
.start h1 span{color:#62f2bd}
.start p{color:#aebbd0;line-height:1.8}
.diff{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:25px 0}
.d{padding:20px 10px;background:#0d1522;color:#fff;border:1px solid #34455d}
.d b{display:block;font-size:21px;margin-bottom:8px}
.d small{color:#9aaac0}
.d.sel{outline:3px solid #62f2bd;background:#102a20;transform:translateY(-4px)}
.startBtn{background:#62f2bd;color:#06140f;font-size:20px;padding:17px 38px}
#hud{position:absolute;z-index:100;top:0;left:0;right:0;padding:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.group{display:flex;gap:7px;flex-wrap:wrap}
.badge{background:#08111de8;border:1px solid #40516c;border-radius:12px;padding:8px 12px;font-size:13px;box-shadow:0 8px 25px #0008}
.badge b{color:#68f3c0}
#world{position:absolute;inset:0}
.floor{position:absolute;left:4%;top:12%;width:92%;height:78%;border:3px solid #46566e;background:repeating-linear-gradient(90deg,#171f2a 0 47px,#1d2733 48px 49px),repeating-linear-gradient(0deg,transparent 0 47px,#0002 48px 49px);box-shadow:inset 0 0 100px #000d}
.wall{position:absolute;z-index:2;background:linear-gradient(135deg,#4a586e,#202a39);border:2px solid #687b96;box-shadow:inset 0 0 25px #0009,0 10px 30px #0009}
.obj{position:absolute;z-index:30;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;pointer-events:auto}
.obj:hover{transform:scale(1.05);filter:brightness(1.3)}
.panel{background:#07111c;border:3px solid #627695;border-radius:11px;flex-direction:column;color:#68f5c4;font-family:monospace;box-shadow:0 10px 30px #000}
.panel b{font-size:22px;letter-spacing:3px}
.panel small{color:#91a0b5;font-family:Arial;margin-top:6px}
.door{width:105px;height:160px;border:5px solid #aa7048;border-radius:12px 12px 3px 3px;background:linear-gradient(90deg,#27150f,#754126,#351c13);box-shadow:inset 0 0 25px #000,0 12px 30px #000;flex-direction:column}
.door strong{font-size:28px}
.door span{font-size:11px;color:#ffe0c1}
.item{width:72px;height:72px;border-radius:17px;background:#091423ee;border:2px solid #72839e;box-shadow:0 10px 25px #000;flex-direction:column;font-size:29px}
.item small{font-size:10px;color:#aebbd0;margin-top:3px}
.note{width:165px;min-height:95px;padding:12px;background:#ded09a;color:#332d21;box-shadow:0 12px 25px #0009;font-size:12px;line-height:1.5;display:block}
.note:hover{transform:rotate(0) scale(1.05)}
.fake{border-color:#9c4444!important}
#inventory{position:absolute;z-index:120;right:12px;bottom:12px;display:flex;gap:6px}
.slot{width:46px;height:46px;border-radius:11px;border:1px solid #455873;background:#0b1421e8;display:flex;align-items:center;justify-content:center;font-size:22px}
#msg{position:absolute;z-index:200;left:50%;bottom:35px;transform:translateX(-50%);width:min(680px,90vw);padding:14px 18px;text-align:center;border:1px solid #4c5e7a;border-radius:14px;background:#050a13ee;box-shadow:0 15px 45px #000c;opacity:0;transition:.2s;pointer-events:none}
#modal{position:absolute;z-index:500;inset:0;display:none;align-items:center;justify-content:center;background:#02040bdc;backdrop-filter:blur(7px)}
.card{width:min(600px,92vw);padding:30px;border-radius:22px;border:1px solid #4c5e7b;background:linear-gradient(145deg,#151e2d,#080d15);box-shadow:0 30px 100px #000}
.card h2{margin:0 0 10px;font-size:30px}
.card p{color:#adbacd;line-height:1.7}
.input{width:100%;padding:16px;border-radius:12px;border:2px solid #536984;background:#050a12;color:#6dffd0;font-size:30px;text-align:center;letter-spacing:7px;outline:none}
.input:focus{border-color:#62f2bd;box-shadow:0 0 20px #62f2bd33}
.actions{display:flex;gap:10px;margin-top:14px}
.ok{background:#62f2bd;color:#06140f}
.cancel{background:#29364a;color:#fff}
#warning{position:absolute;z-index:800;inset:0;display:none;align-items:center;justify-content:center;background:#8d000022;pointer-events:none}
.warning{color:#ff5050;text-align:center;font-size:clamp(30px,6vw,72px);font-weight:1000;text-shadow:0 0 25px red,4px 4px #000;animation:pulse .18s infinite alternate}
.warning small{display:block;font-size:19px;margin-top:10px}
#limit{position:absolute;z-index:110;left:50%;top:78px;transform:translateX(-50%);padding:8px 15px;border-radius:12px;background:#350d0d;border:1px solid #a53b3b;color:#ff8c8c;display:none;font-weight:900}
.shake{animation:shake .08s infinite}
@keyframes shake{0%{transform:translate(0)}25%{transform:translate(5px,-3px)}50%{transform:translate(-5px,4px)}75%{transform:translate(3px,3px)}100%{transform:translate(-3px,-4px)}}
@keyframes pulse{from{opacity:.2}to{opacity:1}}
@media(max-width:720px){
.diff{grid-template-columns:2fr 2fr}
.d{padding:14px 6px}
.badge{font-size:11px}
.door{width:82px;height:125px}
}
</style>
</head>

<body>
<div id="app">

<div id="start">
<div class="start">
<h1>RANDOM <span>ESCAPE</span></h1>
<p>
10개의 방을 탈출하세요.<br>
난이도가 올라갈수록 암호가 복잡해지고 가짜 출구와 함정이 늘어납니다.
</p>

<div class="diff">
<button class="d sel" data-d="easy">
<b>🟢 쉬움</b>
<small>힌트 많음 · 함정 적음</small>
</button>

<button class="d" data-d="normal">
<b>🟡 보통</b>
<small>기본 난이도</small>
</button>

<button class="d" data-d="hard">
<b>🔴 어려움</b>
<small>힌트 감소 · 퍼즐 강화</small>
</button>

<button class="d" data-d="night">
<b>💀 악몽</b>
<small>랜덤 암호 · 함정 · 귀신</small>
</button>
</div>

<button class="startBtn" onclick="start()">GAME START</button>
</div>
</div>

<div id="hud">
<div class="group">
<div class="badge">🚪 <b id="room">ROOM 1 / 10</b></div>
<div class="badge" id="roomName">폐쇄 연구실</div>
<div class="badge">난이도 <b id="difficulty">쉬움</b></div>
</div>

<div class="group">
<div class="badge">🎒 <b id="count">0</b></div>
<div class="badge">⏱️ <b id="time">0:00</b></div>
</div>
</div>

<div id="limit">⏳ 제한시간</div>
<div id="world"></div>
<div id="inventory"></div>
<div id="msg"></div>

<div id="warning">
<div class="warning">
⚠️ 위험 감지
<small>발자국 소리가 가까워진다...</small>
</div>
</div>

<div id="modal">
<div class="card" id="card"></div>
</div>

</div>

<script>
const W=document.getElementById("world");
const M=document.getElementById("modal");
const C=document.getElementById("card");
const MSG=document.getElementById("msg");
const APP=document.getElementById("app");

const names=[
"폐쇄 연구실",
"낡은 창고",
"기록 보관실",
"실험실",
"지하 복도",
"전기실",
"거울의 방",
"보안실",
"뒤틀린 연구소",
"최종 출구"
];

const ICON={
key:"🗝️",
key2:"🗝️",
flash:"🔦",
fuse:"⚡",
cable:"🔌",
card:"💳",
star:"⭐",
final:"🗝️",
battery:"🔋"
};

let difficulty="easy";
let room=1;
let inv=[];
let flags={};
let started=false;
let startTime=0;
let timer=null;
let limitTimer=null;
let usedWarning=false;
let currentCode=null;
let fakeUsed=false;

document.querySelectorAll(".d").forEach(btn=>{
btn.onclick=()=>{
document.querySelectorAll(".d").forEach(x=>x.classList.remove("sel"));
btn.classList.add("sel");
difficulty=btn.dataset.d;
};
});

function level(){
if(difficulty==="easy")return 0;
if(difficulty==="normal")return 1;
if(difficulty==="hard")return 2;
return 3;
}

function difficultyName(){
return{
easy:"쉬움",
normal:"보통",
hard:"어려움",
night:"악몽"
}[difficulty];
}

function start(){

started=true;

document.getElementById("start").style.display="none";
document.getElementById("difficulty").textContent=difficultyName();

startTime=Date.now();

clearInterval(timer);

timer=setInterval(()=>{
document.getElementById("time").textContent=
formatTime((Date.now()-startTime)/1000);
},500);

if(difficulty==="night"){
document.getElementById("limit").style.display="block";
startNightLimit();
}

loadRoom(1);
}

function startNightLimit(){

clearTimeout(limitTimer);

limitTimer=setTimeout(()=>{
if(started){
say("💀 시간이 끝났다...");
gameOver();
}
},15*60*1000);
}

function gameOver(){

started=false;
clearInterval(timer);

M.style.display="flex";

C.innerHTML=`
<h2>💀 탈출 실패</h2>
<p>
시간이 다 되어 버렸습니다.<br>
악몽 난이도에서는 실수할 시간이 없습니다.
</p>
<button class="ok" onclick="location.reload()">다시 도전</button>
`;
}

function formatTime(sec){

sec=Math.floor(sec);

let m=Math.floor(sec/60);
let s=String(sec%60).padStart(2,"0");

return m+":"+s;
}

function say(text){

MSG.textContent=text;
MSG.style.opacity="1";

clearTimeout(say.timer);

say.timer=setTimeout(()=>{
MSG.style.opacity="0";
},2600);
}

function has(id){
return inv.includes(id);
}

function getItem(id){

if(has(id)){
say("이미 가지고 있다.");
return;
}

inv.push(id);

document.getElementById("count").textContent=inv.length;

renderInventory();

say("획득: "+ICON[id]);
}

function renderInventory(){

document.getElementById("inventory").innerHTML=
inv.map(id=>`
<div class="slot">${ICON[id]}</div>
`).join("");
}

function clearWorld(){
W.innerHTML="";
}

function base(){

let f=document.createElement("div");

f.className="floor";

W.appendChild(f);

wall(0,7,7,85);
wall(93,7,7,85);
wall(0,7,100,7);
wall(0,85,100,7);
}

function wall(x,y,w,h){

let e=document.createElement("div");

e.className="wall";

e.style.left=x+"%";
e.style.top=y+"%";
e.style.width=w+"%";
e.style.height=h+"%";

W.appendChild(e);
}

function object(cls,x,y,w,h,html,fn){

let e=document.createElement("div");

e.className="obj "+cls;

e.style.left=x+"%";
e.style.top=y+"%";
e.style.width=w+"%";
e.style.height=h+"%";

e.innerHTML=html;

e.onclick=fn;

W.appendChild(e);

return e;
}

function door(x,y,fn,fake=false){

let e=object(
"door"+(fake?" fake":""),
x,y,11,20,
`
<span>${fake?"FAKE":"EXIT"}</span>
<strong>${fake?"⚠️":"🔒"}</strong>
<span>${fake?"가짜 출구":"탈출구"}</span>
`,
fn
);

return e;
}

function panel(x,y,fn,label="암호 장치"){

return object(
"panel",
x,y,14,13,
`
<b>---</b>
<small>${label}</small>
`,
fn
);
}

function note(x,y,text,fn){

return object(
"note",
x,y,16,14,
text,
fn
);
}

function itemObject(x,y,icon,name,fn){

return object(
"item",
x,y,8,12,
`${icon}<small>${name}</small>`,
fn
);
}

/* 암호 */

function randomCode(){

return String(
Math.floor(1000+Math.random()*9000)
);
}

function openCode(correct){

currentCode=String(correct);

M.style.display="flex";

C.innerHTML=`
<h2>🔢 암호 장치</h2>

<p>
주변 단서를 확인하고 암호를 입력하세요.
${difficulty==="night"?
"<br><b style='color:#ff7777'>⚠️ 악몽: 암호는 매 게임마다 바뀝니다.</b>":
""}
</p>

<input
id="codeInput"
class="input"
type="text"
inputmode="numeric"
maxlength="8"
autocomplete="off"
placeholder="암호 입력"
>

<div class="actions">

<button class="ok"
onclick="submitCode()">
확인
</button>

<button class="cancel"
onclick="closeModal()">
취소
</button>

</div>
`;

setTimeout(()=>{

const input=document.getElementById("codeInput");

if(input){

input.focus();

input.onkeydown=e=>{
if(e.key==="Enter")submitCode();
};

}

},50);
}

function submitCode(){

const input=document.getElementById("codeInput");

if(!input)return;

if(input.value.trim()===String(currentCode)){

flags.code=true;

closeModal();

say("🔓 암호가 맞았다! 잠금이 해제됐다.");

}else{

input.value="";

input.focus();

if(level()>=2){

APP.classList.add("shake");

setTimeout(()=>{
APP.classList.remove("shake");
},350);
}

say("❌ 암호가 틀렸다.");
}
}

function closeModal(){
M.style.display="none";
}

/* 방 */

function loadRoom(n){

room=n;
flags={};
usedWarning=false;
fakeUsed=false;

clearWorld();

document.getElementById("room").textContent=
`ROOM ${n} / 10`;

document.getElementById("roomName").textContent=
names[n-1];

if(n===1)room1();
if(n===2)room2();
if(n===3)room3();
if(n===4)room4();
if(n===5)room5();
if(n===6)room6();
if(n===7)room7();
if(n===8)room8();
if(n===9)room9();
if(n===10)room10();
}

/* ROOM 1 */

function room1(){

base();

let code;

if(difficulty==="easy")code="413";
else if(difficulty==="normal")code="731";
else if(difficulty==="hard")code="5831";
else{
code=randomCode();
flags.secretCode=code;
}

door(44,12,()=>{

if(flags.code)nextRoom();
else say("🔒 암호가 필요하다.");
});

if(difficulty==="easy"){

note(
17,28,
`
<b>연구원 메모</b><br>
314를 거꾸로 읽어라.
`,
()=>{
say("314 → 413");
}
);

}

else if(difficulty==="normal"){

note(
17,28,
`
<b>찢어진 기록</b><br>
첫 숫자는 7.<br>
마지막 숫자는 1.<br>
가운데는 3.
`,
()=>{
say("순서를 조합하면 731.");
}
);

}

else{

note(
16,27,
`
<b>암호 기록</b><br>
1번째 = 5<br>
2번째 = 8<br>
3번째 = 3<br>
4번째 = 1
`,
()=>{
say("순서를 잘 확인해야 한다.");
}
);

}

panel(
67,50,
()=>openCode(code)
);
}

/* ROOM 2 */

function room2(){

base();

wall(33,15,4,70);
wall(62,27,4,58);

door(79,62,()=>{

if(has("key")&&has("key2")){

nextRoom();

}else{

say("🔒 열쇠 2개가 필요하다.");
}
});

itemObject(
16,24,
"🗝️",
"열쇠 A",
()=>getItem("key")
);

itemObject(
72,24,
"🗝️",
"열쇠 B",
()=>getItem("key2")
);

note(
42,40,
`
<b>창고 기록</b><br>
왼쪽 상자와<br>
오른쪽 상자를 찾아라.
`,
()=>{
say("열쇠는 서로 다른 곳에 있다.");
}
);

if(level()>=2){

itemObject(
46,67,
"🗝️",
"가짜 열쇠",
()=>{
say("❌ 가짜 열쇠다!");
APP.classList.add("shake");
setTimeout(()=>APP.classList.remove("shake"),300);
}
);

}

}

/* ROOM 3 */

function room3(){

base();

wall(27,15,4,68);
wall(51,28,4,57);
wall(75,15,4,68);

let code=
difficulty==="easy"?"284":
difficulty==="normal"?"824":
difficulty==="hard"?"428":
randomCode();

door(8,65,()=>{

if(flags.code)nextRoom();
else say("🔒 색상 암호가 필요하다.");
});

note(
14,23,
`
<b>색상 기록</b><br>
🔴 = 2<br>
🔵 = 8<br>
🟢 = 4
`,
()=>{
say("색상의 순서를 잘 살펴보자.");
}
);

if(level()>=2){

note(
15,55,
`
<b>추가 기록</b><br>
경고: 일부 기록은<br>
순서가 뒤집혀 있다.
`,
()=>{
say("문서가 거꾸로 되어 있을 수도 있다.");
}
);

}

panel(
62,48,
()=>openCode(code),
"보안 패널"
);

}

/* ROOM 4 */

function room4(){

base();

wall(20,25,55,4);
wall(20,55,4,30);
wall(70,25,4,60);

let code=
difficulty==="easy"?"32":
difficulty==="normal"?"32":
difficulty==="hard"?"96":
randomCode();

door(43,12,()=>{

if(flags.code)nextRoom();
else say("🔒 계산 암호가 필요하다.");
});

note(
55,63,
`
<b>실험 공식</b><br>
2 × 6 = 12<br>
3 × 7 = 21<br>
4 × 8 = ?
`,
()=>{
say(level()>=2?"규칙을 직접 계산하라.":"정답은 32.");
}
);

if(level()>=2){

note(
25,65,
`
<b>주의</b><br>
계산 결과를<br>
다른 장치와 비교하라.
`,
()=>{
say("단순히 숫자 하나만 보는 게 아니다.");
}
);

}

panel(
24,39,
()=>openCode(code),
"실험실"
);

}

/* ROOM 5 */

function room5(){

base();

wall(30,15,4,70);
wall(60,15,4,70);

door(80,22,()=>{

if(has("flash"))nextRoom();
else say("🔒 손전등이 필요하다.");
});

itemObject(
17,64,
"🔦",
"손전등",
()=>getItem("flash")
);

note(
42,67,
`
<b>낙서</b><br>
빛이 없으면<br>
보이지 않는 문이 있다.
`,
()=>{
say("손전등을 찾자.");
}
);

if(level()>=1){

itemObject(
68,55,
"🔋",
"배터리",
()=>{
getItem("battery");
say("손전등이 더 강해졌다.");
}
);

}

if(level()>=2){

setTimeout(ghostWarning,1500);

}

}

/* ROOM 6 */

function room6(){

base();

wall(45,15,4,70);

door(9,28,()=>{

if(flags.power)nextRoom();
else say("🔒 전력을 복구해야 한다.");
});

itemObject(
69,25,
"⚡",
"퓨즈",
()=>getItem("fuse")
);

itemObject(
69,62,
"🔌",
"케이블",
()=>getItem("cable")
);

panel(
24,42,
()=>{

if(has("fuse")&&has("cable")){

flags.power=true;

say("⚡ 전력 복구 성공!");

}else{

say("퓨즈와 케이블이 필요하다.");
}

},
"발전기"
);

if(level()>=3){

itemObject(
18,65,
"⚡",
"손상된 퓨즈",
()=>{
say("❌ 이건 고장났다.");
}
);

}

}

/* ROOM 7 */

function room7(){

base();

/* 귀신 */

function ghostWarning(){

if(usedWarning)return;

usedWarning=true;

const w=document.getElementById("warning");

w.style.display="flex";

APP.classList.add("shake");

say("⚠️ 뭔가 가까이 다가오고 있다!");

setTimeout(()=>{

w.style.display="none";

APP.classList.remove("shake");

say("👻 !!! 무언가가 바로 뒤에 있었다!");

},1700);

}

/* 다음 방 */

function nextRoom(){

if(room>=10){

finish();

return;
}

M.style.display="flex";

C.innerHTML=`
<h2>🚪 ROOM ${room} 탈출 성공!</h2>
<p>
이번 방은 끝났습니다.<br>
하지만 다음 방은 더 어려워집니다.
</p>
<button class="ok"
onclick="M.style.display='none';loadRoom(${room+1})">
ROOM ${room+1} →
</button>
`;

}

function loadRoom(n){

room=n;

flags={};

usedWarning=false;

fakeUsed=false;

clearWorld();

document.getElementById("room").textContent=
`ROOM ${n} / 10`;

document.getElementById("roomName").textContent=
names[n-1];

if(n===1)room1();
if(n===2)room2();
if(n===3)room3();
if(n===4)room4();
if(n===5)room5();
if(n===6)room6();
if(n===7)room7();
if(n===8)room8();
if(n===9)room9();
if(n===10)room10();
}

/* 엔딩 */

function finish(){

started=false;

clearInterval(timer);
clearTimeout(limitTimer);

const total=(Date.now()-startTime)/1000;

const key="escapeBest_"+difficulty;

const oldBest=
Number(localStorage.getItem(key)||0);

let record=false;

if(!oldBest||total<oldBest){

localStorage.setItem(
key,
Math.floor(total)
);

record=true;
}

M.style.display="flex";

C.innerHTML=`
<h2>🏆 완전 탈출 성공!</h2>

<p>
10개의 방을 모두 탈출했습니다!<br>
난이도: <b>${difficultyName()}</b>
</p>

<div style="
font-size:44px;
color:#68f3c0;
text-align:center;
font-weight:900;
margin:20px 0
">
${formatTime(total)}
</div>

<p style="text-align:center">
${record?
"✨ "+difficultyName()+" 신기록!":
"🏆 최고 기록 "+formatTime(oldBest)}
</p>

<button class="ok"
onclick="location.reload()">
다시 도전
</button>
`;

}

document.addEventListener("keydown",e=>{

if(e.key==="Escape"){

M.style.display="none";

}

});

</script>
